<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Contact</title>
</head>
<body>
  <a href="#main-content">Skip to main content</a>
  <header>
    <h1>Contact StudentHub</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </header>
  <main id="main-content">
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Send Us a Message</h2>
      <form action="#" method="post">
        <fieldset>
          <legend>Contact Form</legend>
          <p><label for="name">Name</label><br><input type="text" id="name" name="name" autocomplete="name" required></p>
          <p><label for="contact-email">Email</label><br><input type="email" id="contact-email" name="email" autocomplete="email" required></p>
          <p><label for="subject">Subject</label><br><input type="text" id="subject" name="subject" required></p>
          <p><label for="message">Message</label><br><textarea id="message" name="message" rows="5" cols="40" required></textarea></p>
          <p><button type="submit">Send Message</button></p>
        </fieldset>
      </form>
    </section>
  </main>
  <footer><p>&copy; 2026 StudentHub</p></footer>
</body>
</html>
