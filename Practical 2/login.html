<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Login</title>
</head>
<body>
  <a href="#main-content">Skip to main content</a>
  <header>
    <h1>Login to StudentHub</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
      <a href="login.html" aria-current="page">Login</a>
    </nav>
  </header>
  <main id="main-content">
    <form action="#" method="post">
      <fieldset>
        <legend>Login Details</legend>
        <p><label for="email">Email address</label><br><input type="email" id="email" name="email" autocomplete="username" required></p>
        <p><label for="password">Password</label><br><input type="password" id="password" name="password" autocomplete="current-password" required></p>
        <p><button type="submit">Login</button></p>
      </fieldset>
    </form>
    <p>New to StudentHub? <a href="register.html">Create an account</a>.</p>
  </main>
  <footer><p>&copy; 2026 StudentHub</p></footer>
</body>
</html>
